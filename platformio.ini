; NB: si esptool crashe avec TypeError ParamType.get_metavar, mettre à jour
; tool-esptoolpy: pio pkg update -e xiao_esp32s3 -t platformio/tool-esptoolpy
; (ou installer click<8.2 dans le venv pio)

[platformio]
default_envs = xiao_esp32s3
; option B: le sketch reste a la racine, compatible Arduino IDE et PlatformIO
src_dir = .
data_dir = data

[env:xiao_esp32s3]
; pioarduino = fork communaute qui suit l'arduino-esp32 core 3.x (le platform
; officiel espressif32 est fige sur core 2.x, incompatible avec ce code)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson @ ^7.4.3
    fortyseveneffects/MIDI Library @ ^5.0.2

[env:esp32s3_generic]
; environnement de reference (ESP32-S3 Dev Module 8MB flash, PSRAM OPI)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    bblanchon/ArduinoJson @ ^7.4.3
    fortyseveneffects/MIDI Library @ ^5.0.2