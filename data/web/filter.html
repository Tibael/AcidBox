<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcidBox — Filter</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>AcidBox</h1>
    <nav class="nav-links">
      <a href="/">Drumpad</a>
      <a href="/config">Config</a>
      <a href="/debug">Debug</a>
      <a href="/filter" class="active">Filter</a>
      <a href="/memory">Memory</a>
    </nav>
    <span id="conn" class="conn-state">connecting&hellip;</span>
  </header>

  <main id="filter-page">
    <section class="filter-section">
      <h3>Sound Selection</h3>
      <div class="filter-row">
        <input type="number" class="filter-note" min="0" max="127" value="36">
        <select id="filter-chan">
          <option value="1">Synth1</option>
          <option value="2">Synth2</option>
          <option value="10" selected>Drums</option>
        </select>
        <button class="btn play-selected">Play</button>
      </div>
    </section>

    <section class="filter-section">
      <h3>TR-808 Controls</h3>

      <h3>General &mdash; all drums</h3>
      <label>Volume <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="7"> <output class="cc-val">64</output></label>
      <label>Pan <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="10"> <output class="cc-val">64</output></label>
      <label>Cutoff <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="74"> <output class="cc-val">64</output></label>
      <label>Resonance <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="71"> <output class="cc-val">64</output></label>
      <label>Pitch <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="89"> <output class="cc-val">64</output></label>
      <label>Decay <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="72"> <output class="cc-val">64</output></label>
      <label>Attack <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="73"> <output class="cc-val">64</output></label>
      <label>Reverb Send <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="91"> <output class="cc-val">64</output></label>
      <label>Delay Send <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="92"> <output class="cc-val">64</output></label>
      <label>Distortion <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="94"> <output class="cc-val">64</output></label>

      <h3>Bass Drum</h3>
      <label>BD Tone <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="21"> <output class="cc-val">64</output></label>
      <label>BD Decay <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="23"> <output class="cc-val">64</output></label>
      <label>BD Level <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="24"> <output class="cc-val">64</output></label>

      <h3>Snare Drum</h3>
      <label>SD Tone <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="25"> <output class="cc-val">64</output></label>
      <label>SD Snap <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="26"> <output class="cc-val">64</output></label>
      <label>SD Level <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="29"> <output class="cc-val">64</output></label>

      <h3>Hi-Hats</h3>
      <label>CH Tune <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="61"> <output class="cc-val">64</output></label>
      <label>CH Level <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="63"> <output class="cc-val">64</output></label>
      <label>OH Tune <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="80"> <output class="cc-val">64</output></label>
      <label>OH Decay <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="81"> <output class="cc-val">64</output></label>
      <label>OH Level <input type="range" class="cc-slider" min="0" max="127" value="64" data-cc="82"> <output class="cc-val">64</output></label>
    </section>

    <section class="filter-section">
      <h3>Presets</h3>
      <select id="preset-list" size="6"></select>
      <div class="filter-row" style="margin-top:8px;gap:8px;flex-wrap:wrap">
        <input type="text" id="preset-name" placeholder="Preset name" maxlength="31" style="flex:1;min-width:120px">
        <button class="btn" id="preset-save">Save</button>
        <button class="btn" id="preset-load">Load</button>
        <button class="btn" id="preset-del">Del</button>
      </div>
    </section>
  <section class="filter-section">
      <h3>Assign to Sensor</h3>
      <div class="filter-row" style="gap:8px">
        <select id="assign-trigger">
          <option value="0">Trigger 1</option>
          <option value="1">Trigger 2</option>
          <option value="2">Trigger 3</option>
          <option value="3">Trigger 4</option>
        </select>
        <button class="btn" id="assign-btn">Assign Current Sound</button>
      </div>
    </section>
  </main>

  <footer>
    <p id="status" class="status">&mdash;</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
